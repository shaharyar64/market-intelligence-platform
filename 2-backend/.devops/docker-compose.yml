name: dashboards-backend

services:
  redis-secure:
    image: redis:8.10.1
    container_name: redis-secure
    env_file:
      - ../.env
    command: sh -c 'redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes'
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  gateway:
    platform: linux/arm64
    image: ${ECR_REGISTRY:-local}/${ECR_REPO_PREFIX:-dashboards-backend}-gateway:${IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: .devops/Dockerfile
      args:
        SERVICE_DIR: gateway
    command: python -m uvicorn gateway.app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - ../.env
    environment:
      HORECA_SERVICE_URL: http://horeca:8003
      EV_SERVICE_URL: http://ev:8002
      BANK_SPATIAL_SERVICE_URL: http://bankspatial:8001
      BEER_CIDER_SERVICE_URL: http://beer:8004
      DIGITAL_BRAND_HEALTH_SERVICE_URL: http://digital:8005
      DATA_SCRAPING_SERVICE_URL: http://scraping:8006
      REAL_ESTATE_SERVICE_URL: http://real-estate:8007
      FOOD_INTELLIGENCE_SERVICE_URL: http://food:8008
      SAUDI_REAL_ESTATE_SERVICE_URL: http://saudi-real-estate:8009
      TRENDS_REAL_ESTATE_SERVICE_URL: http://trends-real-estate:8010
      BANK_BRAND_HEALTH_SERVICE_URL: http://bank-brand-health:8011
      CEER_CAMPAIGN_SERVICE_URL: http://ceer-campaign:8012
      UAE_BANK_BRAND_HEALTH_SERVICE_URL: http://uae-bank-brand-health:8013
      REDIS_HOST: redis-secure:6379
    ports:
      - "8000:8000"
    depends_on:
      - redis-secure
      - bankspatial
      - ev
      - horeca
      - beer
      - digital
      - scraping
      - real-estate
      - food
      - saudi-real-estate
      - trends-real-estate
      - bank-brand-health
      - ceer-campaign
      - uae-bank-brand-health
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  bankspatial:
    platform: linux/arm64
    image: ${ECR_REGISTRY:-local}/${ECR_REPO_PREFIX:-dashboards-backend}-bankspatial:${IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: .devops/Dockerfile
      args:
        SERVICE_DIR: services/bankspatial_service
    command: python -m uvicorn services.bankspatial_service.app.main:app --host 0.0.0.0 --port 8001
    env_file:
      - ../.env
    ports:
      - "8001:8001"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
