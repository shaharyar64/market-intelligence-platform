name: Build & Push to ECR

on:
  push:
    branches: ["prod"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Derive ECR registry and repo name
        run: |
          ECR_REGISTRY="${{ secrets.ECR_REPO_URI }}"
          ECR_REGISTRY="${ECR_REGISTRY%/}"
          ECR_REPO_NAME="dashboards-ui"

          if [ -z "${ECR_REGISTRY}" ]; then
            echo "ECR_REPO_URI secret is empty (expected registry like 123456789012.dkr.ecr.us-east-1.amazonaws.com)"
            exit 1
          fi

          if [[ "${ECR_REGISTRY}" == *"/"* ]]; then
            echo "ECR_REPO_URI should contain only registry hostname, got: ${ECR_REGISTRY}"
            exit 1
          fi

          echo "ECR_REGISTRY=${ECR_REGISTRY}" >> "$GITHUB_ENV"
          echo "ECR_REPO_NAME=${ECR_REPO_NAME}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${{ github.sha }}" >> "$GITHUB_ENV"
          echo "DOCKER_PLATFORM=linux/arm64" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Validate ECR repo exists
        run: |
          if [ -z "${ECR_REPO_NAME}" ]; then
            echo "Invalid repo name derived from ECR_REPO_NAME='${ECR_REPO_NAME}'"
            exit 1
          fi
          aws ecr describe-repositories --repository-names "${ECR_REPO_NAME}" >/dev/null

      - name: Resolve build-time public env
        run: |
          SECRET_JSON="$(aws secretsmanager get-secret-value \
            --secret-id prod-dashboard-ui-env \
            --query SecretString \
            --output text)"

          NEXT_PUBLIC_API_URL="$(echo "${SECRET_JSON}" | jq -r '.NEXT_PUBLIC_API_URL // empty')"
          if [ -z "${NEXT_PUBLIC_API_URL}" ] || [ "${NEXT_PUBLIC_API_URL}" = "null" ]; then
            echo "NEXT_PUBLIC_API_URL missing in prod-dashboard-ui-env"
            exit 1
          fi

          NEXT_PUBLIC_AI_CHAT_API_URL="$(echo "${SECRET_JSON}" | jq -r '.NEXT_PUBLIC_AI_CHAT_API_URL // empty')"
          if [ -z "${NEXT_PUBLIC_AI_CHAT_API_URL}" ] || [ "${NEXT_PUBLIC_AI_CHAT_API_URL}" = "null" ]; then
            echo "NEXT_PUBLIC_AI_CHAT_API_URL missing in prod-dashboard-ui-env"
            exit 1
          fi

          echo "NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_AI_CHAT_API_URL=${NEXT_PUBLIC_AI_CHAT_API_URL}" >> "$GITHUB_ENV"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .docker/Dockerfile
          build-args: |
            BUILDPLATFORM=linux/amd64
            TARGETPLATFORM=linux/arm64
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_AI_CHAT_API_URL=${{ env.NEXT_PUBLIC_AI_CHAT_API_URL }}
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_NAME }}:prod
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_NAME }}:${{ env.IMAGE_TAG }}
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy:
    runs-on: [self-hosted, prod]
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Derive ECR registry and repo name
        run: |
          ECR_REGISTRY="${{ secrets.ECR_REPO_URI }}"
          ECR_REGISTRY="${ECR_REGISTRY%/}"
          ECR_REPO_NAME="dashboards-ui"

          if [ -z "${ECR_REGISTRY}" ]; then
            echo "ECR_REPO_URI secret is empty (expected registry like 123456789012.dkr.ecr.us-east-1.amazonaws.com)"
            exit 1
          fi

          if [[ "${ECR_REGISTRY}" == *"/"* ]]; then
            echo "ECR_REPO_URI should contain only registry hostname, got: ${ECR_REGISTRY}"
            exit 1
          fi

          echo "ECR_REGISTRY=${ECR_REGISTRY}" >> "$GITHUB_ENV"
          echo "ECR_REPO_NAME=${ECR_REPO_NAME}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${{ github.sha }}" >> "$GITHUB_ENV"
          echo "DOCKER_PLATFORM=linux/arm64" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Fetch runtime env from Secrets Manager
        run: |
          SECRET_STRING="$(aws secretsmanager get-secret-value \
            --secret-id prod-dashboard-ui-env \
            --query SecretString \
            --output text)"

          echo "${SECRET_STRING}" | jq -r '
            to_entries
            | map("\(.key)=\(.value|tostring)")
            | .[]
          ' > .env

      - name: Pull release image
        run: |
          IMAGE="${ECR_REGISTRY}/${ECR_REPO_NAME}:${IMAGE_TAG}"
          docker pull --platform linux/arm64 "${IMAGE}"
          ARCH="$(docker image inspect "${IMAGE}" --format '{{.Architecture}}')"
          if [ "${ARCH}" != "arm64" ]; then
            echo "Expected arm64 image, got ${ARCH}"
            exit 1
          fi

      - name: Deploy with Docker Compose
        run: |
          docker compose -f .docker/docker-compose.yml up -d --no-build --force-recreate

      - name: Verify running container architecture
        run: |
          CID="$(docker compose -f .docker/docker-compose.yml ps -q app)"
          if [ -z "${CID}" ]; then
            echo "app container not found after deploy"
            exit 1
          fi
          IMAGE_ID="$(docker inspect "${CID}" --format '{{.Image}}')"
          RUNNING_ARCH="$(docker image inspect "${IMAGE_ID}" --format '{{.Architecture}}')"
          if [ "${RUNNING_ARCH}" != "arm64" ]; then
            echo "Expected running app arch arm64, got ${RUNNING_ARCH}"
            exit 1
          fi
